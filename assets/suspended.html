<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STEENY</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #11100f; color: #ded7f4; }
    body { display: grid; place-items: center; font: 600 15px system-ui, sans-serif; }
    main { display: flex; align-items: center; gap: 14px; }
    i { display: block; width: 16px; height: 16px; border: 2px solid #8675ad; border-top-color: #c2a9ff; border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body><main><i aria-hidden="true"></i>Возвращаем интерфейс…</main></body>
</html>
